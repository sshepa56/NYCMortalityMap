# Builds and publishes the website every time you push to main.
#
# 1. Jekyll turns the Markdown files (README.md, about.md, ...) into web pages.
# 2. JupyterLite turns everything in the notebook/ folder into an in-browser
#    Jupyter environment, published at /notebook/ on your site.
#
# For this to work, go to Settings -> Pages and set Source to "GitHub Actions".

name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Build Markdown pages with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install JupyterLite
        # jupyterlite-core + jupyterlite-pyodide-kernel: JupyterLite with a Python kernel
        # jupyter-server: needed to copy files from notebook/ into the site
        # plotly: includes the extension that draws Plotly charts in notebooks
        run: pip install jupyterlite-core jupyterlite-pyodide-kernel jupyter-server plotly

      - name: Build JupyterLite from the notebook/ folder
        run: jupyter lite build --contents notebook --output-dir _jupyterlite

      - name: Add JupyterLite to the site
        # sudo because the Jekyll step creates _site as a different user
        run: sudo cp -r _jupyterlite _site/notebook

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
